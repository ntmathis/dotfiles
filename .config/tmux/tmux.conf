# ~/.config/tmux/tmux.conf

#https://tmux.info/docs/advanced

# ============================================
# ESSENTIAL SETTINGS
# ============================================

# Fix Vim ESC delay
set -sg escape-time 0

# Increase scrollback buffer
set -g history-limit 50000

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse support
set -g mouse on

# Pass environment variables through to tmux sessions
# This allows env vars like NVIDIA_NIM_API_KEY, CONTEXT7_API_KEY to be available in panes
set -g update-environment "NVIDIA_NIM_API_KEY CONTEXT7_API_KEY"

# Enable focus events for vim autoread
set -g focus-events on

# Set terminal with proper colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# ============================================
# THEME: Gruvbox Dark
# ============================================

set -g status-style "bg=default fg=#ebdbb2"
set -g status-left '#[fg=#fabd2f,bold]#S #[fg=#3c3836]│'
set -g window-status-current-format '#[fg=#fabd2f,bold]#I:#W#F'
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#fabd2f"
set -g display-panes-active-colour "#fabd2f"
# set -g display-panes-inactive-colour "#3c3836"  # Not a valid tmux option
set -g message-style "bg=#fabd2f fg=#000000 bold"
set -g status-right '#[fg=#3c3836]│ #[fg=#fabd2f]#(cd '\''#{pane_current_path}'\'' 2>/dev/null && { git status --porcelain 2>/dev/null | grep -q . && printf '\''✗'\'' || printf '\''✔'\''; } ; if git rev-parse --abbrev-ref @{upstream} >/dev/null 2>&1; then git rev-list --left-right --count @{upstream}...HEAD 2>/dev/null | awk '\''{print \$2,\$1}'\'' | while read ahead behind; do [ \$ahead -gt 0 ] && printf '\''⇡'\''; [ \$behind -gt 0 ] && printf '\''⇣'\'' ; done; fi) #[fg=#fabd2f]#(~/.config/tmux/battery-status.sh)'

# Non-color appearance settings (global)
set -g status-position bottom
set -g status-left-length 20
set -g status-right-length 80
set -g status-justify centre

# Two spaces between windows for clearer click detection
# set -g window-status-separator " "

# Uniform window format: no flags, no extra spaces
set -g window-status-format '#I:#W#F'

# Aggressive resize for multi-client
setw -g aggressive-resize off
# can't be used on iterm2

# ============================================
# KEY BINDINGS
# ============================================

# Change prefix to Ctrl+z
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
# adds ctrl+r for redundancy and user friendlyness
bind C-r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Better pane splitting (and keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Alt+Tab to cycle through windows
bind -n -r M-Tab next-window

# Mobile-friendly: Ctrl+N/P for window navigation
bind -n -r C-n next-window
bind -n -r C-p previous-window
# Direct Ctrl+g binding for lazygit (same behavior as prefix+g)
bind -n C-g split-window -h -c "#{pane_current_path}" \; split-window -v -c "#{pane_current_path}" \; select-pane -U \; send-keys -R "lazygit --screen-mode=full" C-m \; select-pane -L \; resize-pane -R 10

# Launch lazygit with prefix + g (Ctrl+a, then g)
# Creates vertical split with lazygit on right, horizontal split in main area
# Main area gets wider horizontal space, lazygit gets narrower vertical space
bind g split-window -h -c "#{pane_current_path}" \; split-window -v -c "#{pane_current_path}" \; select-pane -U \; send-keys -R "lazygit --screen-mode=full" C-m \; select-pane -L \; resize-pane -R 10

# Open nvim in current directory with prefix + v
bind v split-window -h -c "#{pane_current_path}" nvim .

# claude-tmux popup (https://github.com/nielsgroen/claude-tmux): cargo install claude-tmux
bind -n C-z display-popup -E -w 80% -h 81% "~/.cargo/bin/claude-tmux --preview-size 48"

# ============================================
# APPEARANCE
# ============================================

# ============================================
# COPY MODE
# ============================================

# Use vi keys
setw -g mode-keys vi

# Vi-style copy bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"  # macOS
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -i"  # Linux
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe "pbcopy"  # Fix mouse scroll position after copy

# ============================================
# PLUGINS (via TPM)
# ============================================

# Install TPM first:
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Plugin settings
set -g @resurrect-strategy-vim 'session'
set -g @continuum-restore 'on'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'

# Format variables
#{session_name}    # Current session
#{window_index}    # Window number
#{window_name}     # Window name
#{pane_current_path}  # Current directory
#{host}            # Hostname
#{?window_zoomed_flag,🔍,}  # Conditional

# Shell commands
#(uptime | cut -d "," -f 3)  # Load average
#(date +%H:%M)               # Custom time

# No prefix needed (-n flag)
bind -n C-t new-window -c "#{pane_current_path}"

# Repeatable binding (-r flag)
bind -r C-Up resize-pane -U

# Conditional logic
if-shell 'test -n "$SSH_CLIENT"' \
  'set -g status-bg blue'

# Enable synchronization
# Ctrl+b :setw synchronize-panes on

# Disable
# Ctrl+b :setw synchronize-panes off

# Toggle binding (add to tmux.conf)
# bind S setw synchronize-panes
set -g extended-keys on
